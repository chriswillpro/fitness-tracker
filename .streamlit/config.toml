# Fitness Tracker theme — energetic dark, tuned for daily gym-log use.
[theme]
base = "dark"
primaryColor = "#d95926"
backgroundColor = "#0e0f13"
secondaryBackgroundColor = "#1a1c22"
textColor = "#f5f5f5"
linkColor = "#d95926"
borderColor = "#2a2d36"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
linkUnderline = false

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

blueColor = "#3987e5"
greenColor = "#0ca30c"
yellowColor = "#c98500"
orangeColor = "#d95926"
violetColor = "#9085e9"
redColor = "#e66767"
grayColor = "#898781"

chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartSequentialColors = ["#cde2fb", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#184f95", "#0d366b"]

[theme.sidebar]
backgroundColor = "#0a0b0e"
secondaryBackgroundColor = "#15171d"
borderColor = "#2a2d36"
